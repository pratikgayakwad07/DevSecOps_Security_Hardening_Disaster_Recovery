name: AWS DevSecOps Security Hardening and Disaster Recovery

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: "Select the operation to run"
        type: choice
        required: true
        default: validate
        options:
          - validate
          - deploy
          - rollback-review

permissions:
  contents: read
  

env:
  TF_ROOT: terraform
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.12.2"
  CHECKOV_VERSION: "3.2.357"
  TRIVY_VERSION: "latest"
  PYTHON_VERSION: "3.12"

jobs:

  # ---------------- VALIDATE ----------------

  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check Terraform formatting
        working-directory: terraform
        run: |
          terraform version
          terraform fmt -check -recursive

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialize Terraform without backend
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: terraform
        run: terraform validate

  ansible-syntax:
    name: Ansible Syntax and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: pip 
          # Yeh hata diya hai taaki requirements.txt ki zaroorat na pade

      - name: Install Ansible and Ansible Lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            ansible-core==2.17.7 \
            ansible-lint==24.10.0 
          ansible-galaxy collection install community.general

      - name: Check Ansible playbook syntax
        run: |
          ansible-playbook \
            --syntax-check \
            -i ansible/inventory/hosts.ini \
            ansible/playbooks/secops_hardening.yml

      - name: Lint Ansible playbook
        run: |
          ansible-lint ansible/playbooks/secops_hardening.yml

  shell-lint:
    name: Shell Script Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/mnt" \
            -w /mnt \
            koalaman/shellcheck:v0.10.0 \
            scripts/backup.sh scripts/restore.sh

  # ---------------- SECURITY ----------------

  checkov:
    name: Terraform Security Scan - Checkov
    runs-on: ubuntu-latest
    needs:
      - terraform-fmt
      - terraform-validate
      - ansible-syntax
      - shell-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            bridgecrew/checkov:${{ env.CHECKOV_VERSION }} \
            -d terraform \
            --framework terraform \
            --soft-fail

  trivy-filesystem:
    name: Filesystem Security Scan - Trivy
    runs-on: ubuntu-latest
    needs:
      - terraform-fmt
      - terraform-validate
      - ansible-syntax
      - shell-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "0"

  sonarqube:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs:
      - terraform-fmt
      - terraform-validate
      - ansible-syntax
      - shell-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check SonarQube configuration
        id: sonar-config
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -n "$SONAR_HOST_URL" ] && \
             [ -n "$SONAR_TOKEN" ] && \
             [ -n "$SONAR_PROJECT_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SonarQube configuration incomplete; scanner skipped."
          fi

      - name: Restore SonarQube cache
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: .sonar/cache
          key: sonar-cache-${{ runner.os }}
          restore-keys: |
            sonar-cache-${{ runner.os }}-

      - name: Run SonarQube scanner and wait for quality gate
        if: steps.sonar-config.outputs.enabled == 'true'
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          docker run --rm \
            -e SONAR_HOST_URL \
            -e SONAR_TOKEN \
            -v "$GITHUB_WORKSPACE:/usr/src" \
            -v "$GITHUB_WORKSPACE/.sonar/cache:/opt/sonar-scanner/.sonar/cache" \
            -w /usr/src \
            sonarsource/sonar-scanner-cli:11 \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.sources=terraform,ansible,scripts \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.qualitygate.wait=true

  # ---------------- DEPLOY: PLAN & APPLY ----------------

  terraform-plan-apply:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    needs:
      - checkov
      - trivy-filesystem
      - sonarqube
    if: >-
     (github.event_name == 'push') ||
     (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          role-session-name: ${{ vars.AWS_ROLE_SESSION_NAME || 'github-actions-plan' }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -input=false

      - name: Generate Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan -lock=false

      - name: Export readable plan
        working-directory: terraform
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload Terraform plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            terraform/tfplan
            terraform/tfplan.txt
          retention-days: 1
          if-no-files-found: error
          
      - name: Apply reviewed Terraform plan
        working-directory: terraform
        run: terraform apply -lock=false -input=false -auto-approve tfplan 
  

  # ---------------- DEPLOY: ANSIBLE HARDENING ----------------
  ansible-hardening:
    name: Ansible Security Hardening
    runs-on: ubuntu-latest
    needs: terraform-plan-apply
    if: >-
      github.event_name == 'push' &&
      github.ref == format(
        'refs/heads/{0}',
        github.event.repository.default_branch
      )
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          role-session-name: ${{ vars.AWS_ROLE_SESSION_NAME || 'github-actions-hardening' }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: pip  <-- Yeh hata diya hai taaki requirements.txt ki zaroorat na pade

      - name: Install Ansible and SSH client
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.17.7
          ansible-galaxy collection install community.general
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Configure optional Ansible SSH key
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -n "$ANSIBLE_SSH_PRIVATE_KEY" ]; then
            install -d -m 700 "$HOME/.ssh"
            eval "$(ssh-agent -s)"
            printf '%s\n' "$ANSIBLE_SSH_PRIVATE_KEY" | ssh-add -
            {
              echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
              echo "SSH_AGENT_PID=$SSH_AGENT_PID"
            } >> "$GITHUB_ENV"
          else
            echo "No optional SSH key supplied; using inventory-configured authentication."
          fi

      - name: Execute Ansible security hardening
        run: |
          echo "Executing Ansible hardening on provisioned EC2 instances..."
          ansible-playbook \
            -i ansible/inventory/hosts.ini \
            ansible/playbooks/secops_hardening.yml
  # ---------------- RECOVERY: MANUAL REVIEW ----------------
  rollback-manual:
    name: Manual Rollback Review
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format(
        'refs/heads/{0}',
        github.event.repository.default_branch
      ) &&
      inputs.action == 'rollback-review'
    environment: recovery-approval
    steps:
      - name: Validate approved rollback runbook
        env:
          ROLLBACK_RUNBOOK_URL: ${{ vars.ROLLBACK_RUNBOOK_URL }}
        run: |
          if [ -z "$ROLLBACK_RUNBOOK_URL" ]; then
            echo "Set ROLLBACK_RUNBOOK_URL to the approved runbook."
            exit 1
          fi

          echo "Rollback requires operator approval."
          echo "Follow the approved runbook: $ROLLBACK_RUNBOOK_URL"
          echo "Record evidence and follow the recovery procedure."
          echo "No infrastructure will be destroyed automatically."
